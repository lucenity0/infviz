[project]
name = "infviz"
version = "0.1.0"
description = "Visual inference debugger engine: paged KV, continuous batching, speculative decoding, event stream"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "safetensors>=0.4",
  "tokenizers>=0.20",
  "huggingface_hub>=0.25",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "transformers>=4.45", "accelerate>=0.30"]

[project.scripts]
infviz = "infviz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infviz"]

[tool.pytest.ini_options]
markers = ["models: loads real Qwen2.5 weights (slow-ish)"]
