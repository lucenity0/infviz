<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Pipeline: the engine emits events over a WebSocket or to a trace file; a pure reducer rebuilds state for the panels."><defs>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#161513" stroke-width="1.5"/></pattern>
  <pattern id="hatchl" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="#85806F" stroke-width="1.1"/></pattern>
  <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.05" fill="#161513"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0,1.5 L9,5 L0,8.5" fill="none" stroke="#161513" stroke-width="1.4"/></marker>
</defs><rect width="1280" height="330" fill="#F5F4F0"/><text x="40.0" y="34.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="400" fill="#85806F" text-anchor="start" letter-spacing="1.2">HOW IT FITS TOGETHER</text><line x1="40" y1="48" x2="1240" y2="48" stroke="#161513" stroke-width="1.2"/><rect x="40" y="78" width="330" height="168" fill="#F5F4F0" stroke="#161513" stroke-width="1.2"/><text x="54.0" y="102.0" font-family="Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#161513" text-anchor="start">engine  (PyTorch · MPS / CUDA)</text><text x="54.0" y="124.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">scheduler: admit · reserve KV · preempt</text><text x="54.0" y="142.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">paged KV pools: target + draft</text><text x="54.0" y="160.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">draft k tokens → one target verify pass</text><text x="54.0" y="178.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">accept · roll back · commit · finish</text><text x="54.0" y="196.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">every state change → one event</text><line x1="370" y1="162" x2="420" y2="162" stroke="#161513" stroke-width="1.3"/><text x="395.0" y="154.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#85806F" text-anchor="middle" letter-spacing="0.6">EVENTS</text><line x1="420" y1="162" x2="470" y2="115" stroke="#161513" stroke-width="1.3" marker-end="url(#arr)"/><line x1="420" y1="162" x2="470" y2="209" stroke="#161513" stroke-width="1.3" marker-end="url(#arr)"/><rect x="470" y="78" width="250" height="74" fill="#F5F4F0" stroke="#161513" stroke-width="1.2"/><text x="484.0" y="102.0" font-family="Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#161513" text-anchor="start">WebSocket  /ws</text><text x="484.0" y="124.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">live: config + snapshot + stream</text><rect x="470" y="172" width="250" height="74" fill="#F5F4F0" stroke="#161513" stroke-width="1.2"/><text x="484.0" y="196.0" font-family="Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#161513" text-anchor="start">trace.jsonl</text><text x="484.0" y="218.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">record once, replay anywhere</text><line x1="720" y1="115" x2="812" y2="150" stroke="#161513" stroke-width="1.3" marker-end="url(#arr)"/><line x1="720" y1="209" x2="812" y2="174" stroke="#161513" stroke-width="1.3" marker-end="url(#arr)"/><rect x="812" y="78" width="180" height="168" fill="#F5F4F0" stroke="#161513" stroke-width="1.2"/><text x="826.0" y="102.0" font-family="Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#161513" text-anchor="start">reducer</text><text x="826.0" y="124.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">pure: state =</text><text x="826.0" y="142.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">f(events ≤ playhead)</text><text x="826.0" y="160.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start"></text><text x="826.0" y="178.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">animation =</text><text x="826.0" y="196.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">f(playhead − t)</text><line x1="992" y1="162" x2="1060" y2="162" stroke="#161513" stroke-width="1.3" marker-end="url(#arr)"/><rect x="1060" y="78" width="180" height="168" fill="#F5F4F0" stroke="#161513" stroke-width="1.2"/><text x="1074.0" y="102.0" font-family="Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" fill="#161513" text-anchor="start">panels</text><text x="1074.0" y="124.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">KV cache</text><text x="1074.0" y="142.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">timeline</text><text x="1074.0" y="160.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">speculation</text><text x="1074.0" y="178.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" font-weight="400" fill="#47443E" text-anchor="start">status · transport</text><path d="M902,246 V286 H205 V246" fill="none" stroke="#85806F" stroke-width="1.1" stroke-dasharray="3 3"/><text x="553.0" y="304.0" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="400" fill="#85806F" text-anchor="middle" letter-spacing="0.6">HONESTY CHECK · the reducer must reproduce every engine snapshot exactly (pytest + vitest)</text></svg>
