name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  honesty:
    name: replay honesty check (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the reference reducer is pure Python: no torch, no model weights
      - run: PYTHONPATH=engine/src python -m infviz.replay web/public/demo.jsonl

  web:
    name: web (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: TRACE=public/demo.jsonl npx vitest run
      - run: npm run build
